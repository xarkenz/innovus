[package]
name = "innovus"
version = "0.1.0"
edition = "2024"
default-run = "sandbox"

[lib]
name = "innovus"
path = "innovus/src/lib.rs"

[[bin]]
name = "sandbox"
path = "sandbox/src/main.rs"

# [[bin]]
# name = "snek"
# path = "snek/src/main.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
env_logger = "0.11"
fnv = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
json = "0.12"
log = "0.4"
num = "0.4"
pollster = "0.4"
rodio = "0.22"
uuid = { version = "1.22", features = ["v4", "fast-rng"] }
wgpu = "29.0"
winit = "0.30"
